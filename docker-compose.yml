version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      SA_PASSWORD: "BookStore2025!"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:latest
    container_name: redis

    ports:
      - "6379:6379"

  catalog-api:
    build:
      context: .
      dockerfile: BookStore.Catalog.API/Dockerfile

    container_name: catalog-api

    ports:
      - "5001:8080"

    depends_on:
      - sqlserver
      - rabbitmq
      - redis

  ordering-api:
    build:
      context: .
      dockerfile: BookStore.Ordering.API/Dockerfile

    container_name: ordering-api

    ports:
      - "5002:8080"

    depends_on:
      - sqlserver
      - rabbitmq